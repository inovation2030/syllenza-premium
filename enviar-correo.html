<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/gif" href="assets/logo-syllenza.gif" />
<title>✦ Enviar correo · Syllenza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060509; --bg2:#0a0d1a; --panel:#0e0b16;
    --gold:#fca611; --gold-2:#fbc642; --gold-pale:#fcda59;
    --ink:#f5e9c8; --muted:#d8c98a; --dim:#9a8f6a;
    --line:rgba(252,166,17,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:radial-gradient(1200px 700px at 50% -10%, #141a33 0%, var(--bg) 55%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;min-height:100%}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px}
  .logo{text-align:center;margin-bottom:6px}
  .logo img{width:150px;max-width:60%;display:block;margin:0 auto 8px}
  .logo h1{font-family:"Cinzel Decorative",Cinzel,serif;color:var(--gold);letter-spacing:3px;font-size:22px;margin:0}
  .logo p{color:var(--muted);font-size:15px;margin:6px 0 0;font-style:italic}
  .card{background:linear-gradient(180deg,rgba(252,166,17,.07),rgba(252,166,17,.02));border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-top:20px;box-shadow:0 0 40px rgba(252,166,17,.08)}
  label{display:block;font-family:Cinzel,serif;font-size:12px;letter-spacing:2px;color:var(--gold);margin:16px 0 6px;text-transform:uppercase}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;background:#0a0812;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:17px;padding:12px 14px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(252,166,17,.25)}
  textarea{min-height:180px;resize:vertical;line-height:1.6}
  .btn{display:block;width:100%;margin-top:22px;background:linear-gradient(180deg,#fdc84b,#fca611 55%,#e8890a);color:#241503;font-family:"Cinzel Decorative",Cinzel,serif;font-weight:700;font-size:17px;letter-spacing:2px;border:none;border-radius:12px;padding:14px 18px;cursor:pointer;box-shadow:0 6px 24px rgba(252,166,17,.35)}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);box-shadow:none;font-size:14px;padding:10px 14px;margin-top:12px}
  .msg{margin-top:16px;font-size:16px;line-height:1.6;text-align:center;min-height:24px}
  .msg.ok{color:#9fe8a8}
  .msg.err{color:#ff9d9d}
  .hint{color:var(--dim);font-size:14px;text-align:center;margin-top:14px;line-height:1.6}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .hidden{display:none}
  .from-line{color:var(--dim);font-size:14px;text-align:center;margin-top:8px}
  .from-line b{color:var(--gold-pale)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <img src="assets/logo-syllenza.gif" alt="Syllenza" />
    <h1>✦ SYLLENZA ✦</h1>
    <p>Enviar un correo a un cliente</p>
  </div>
  <p class="from-line">Se envía desde <b>promocion@syllenza.com</b> · solo para el dueño</p>

  <div class="card" id="paso-clave">
    <label for="clave">Tu clave</label>
    <input type="password" id="clave" placeholder="Escribe tu clave" autocomplete="off" />
    <button class="btn" id="btn-entrar" type="button">✦ Entrar</button>
    <p class="msg" id="msg-clave"></p>
    <p class="hint">Esta página no está en el menú del sitio.<br/>Solo tú tienes el enlace y la clave.</p>
  </div>

  <div class="card hidden" id="paso-correo">
    <label for="cliente">Cliente</label>
    <select id="cliente"><option value="">— Cargando clientes… —</option></select>
    <label for="correo">O escribe el correo</label>
    <input type="email" id="correo" placeholder="cliente@correo.com" autocomplete="off" />
    <label for="asunto">Asunto</label>
    <input type="text" id="asunto" placeholder="Asunto del correo" autocomplete="off" />
    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" placeholder="Escribe tu mensaje con cariño…"></textarea>
    <button class="btn" id="btn-enviar" type="button">✦ Enviar correo</button>
    <button class="btn ghost" id="btn-salir" type="button">Salir</button>
    <p class="msg" id="msg-envio"></p>
    <p class="hint">El correo llega con el logo de Syllenza y los colores dorados.<br/>El cliente no puede responder a este correo.</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycbw9vCNPuk9qklqCOZxTpah70884bCkn8rMNhPraKYC6eVeeBDrqER7XatoE5PuxUPBvKQ/exec";
  var clave = "";
  var $ = function(id){ return document.getElementById(id); };

  function llamar(params){
    var q = Object.keys(params).map(function(k){
      return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
    }).join("&");
    return fetch(API + "?" + q).then(function(r){ return r.json(); });
  }

  $("btn-entrar").addEventListener("click", function(){
    var c = $("clave").value.trim();
    var m = $("msg-clave");
    if(!c){ m.textContent = "Escribe tu clave, por favor."; m.className = "msg err"; return; }
    m.textContent = "Verificando…"; m.className = "msg";
    $("btn-entrar").disabled = true;
    llamar({accion:"listar", clave:c}).then(function(res){
      $("btn-entrar").disabled = false;
      if(!res || !res.ok){
        m.textContent = (res && res.error) ? ("No se pudo entrar: " + res.error) : "No se pudo conectar. Inténtalo de nuevo.";
        m.className = "msg err";
        return;
      }
      clave = c;
      $("paso-clave").classList.add("hidden");
      $("paso-correo").classList.remove("hidden");
      var sel = $("cliente");
      sel.innerHTML = '<option value="">— Elige un cliente —</option>';
      (res.clientes || []).forEach(function(cl){
        var o = document.createElement("option");
        o.value = cl.correo;
        o.textContent = (cl.nombre || cl.correo) + " · " + cl.correo + (cl.sellos ? (" · " + cl.sellos + " sellos") : "");
        sel.appendChild(o);
      });
      if(!(res.clientes || []).length){
        sel.innerHTML = '<option value="">— Aún no hay clientes guardados —</option>';
      }
    }).catch(function(){
      $("btn-entrar").disabled = false;
      m.textContent = "No se pudo conectar. Revisa tu internet e inténtalo de nuevo.";
      m.className = "msg err";
    });
  });

  $("cliente").addEventListener("change", function(){
    if(this.value) $("correo").value = this.value;
  });

  $("btn-enviar").addEventListener("click", function(){
    var correo = $("correo").value.trim().toLowerCase();
    var asunto = $("asunto").value.trim();
    var mensaje = $("mensaje").value.trim();
    var m = $("msg-envio");
    if(!correo || correo.indexOf("@") < 0){ m.textContent = "Escribe un correo válido, por favor."; m.className = "msg err"; return; }
    if(!asunto){ m.textContent = "Escribe el asunto, por favor."; m.className = "msg err"; return; }
    if(!mensaje){ m.textContent = "Escribe el mensaje, por favor."; m.className = "msg err"; return; }
    m.textContent = "Enviando con cariño…"; m.className = "msg";
    $("btn-enviar").disabled = true;
    llamar({accion:"enviar", clave:clave, correo:correo, asunto:asunto, mensaje:mensaje}).then(function(res){
      $("btn-enviar").disabled = false;
      if(res && res.ok){
        m.textContent = "✦ Correo enviado a " + correo + ". ¡Qué bien! 💛";
        m.className = "msg ok";
        $("asunto").value = "";
        $("mensaje").value = "";
      } else {
        m.textContent = (res && res.error) ? ("No se pudo enviar: " + res.error) : "No se pudo enviar. Inténtalo de nuevo.";
        m.className = "msg err";
      }
    }).catch(function(){
      $("btn-enviar").disabled = false;
      m.textContent = "No se pudo conectar. Revisa tu internet e inténtalo de nuevo.";
      m.className = "msg err";
    });
  });

  $("btn-salir").addEventListener("click", function(){
    clave = "";
    $("clave").value = "";
    $("msg-clave").textContent = "";
    $("paso-correo").classList.add("hidden");
    $("paso-clave").classList.remove("hidden");
  });

  $("clave").addEventListener("keydown", function(e){ if(e.key === "Enter") $("btn-entrar").click(); });
})();
</script>
</body>
</html>
